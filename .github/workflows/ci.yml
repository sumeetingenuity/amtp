# ============================================================
# AMTP Protocol — GitHub Actions CI/CD
# Runs on: push to any branch, pull requests against main
# ============================================================

name: amtp-ci

# -----------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from the UI

# -----------------------------------------------------------------------
# Default environment
# -----------------------------------------------------------------------
env:
  NODE_VERSION: "20.x"
  NPM_VERSION: "9.x"

# -----------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------
  # Job 1 — Install, lint, type-check, build, test (matrix: Node 20/22)
  # ---------------------------------------------------------------
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type-check
        run: npm run type-check
        continue-on-error: false

      - name: Build
        run: npm run build
        continue-on-error: false

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true   # surface as warning, not blocker on first run

      - name: Run test suite
        run: npm test -- --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ---------------------------------------------------------------
  # Job 2 — Build Docker image (only on main or tagged releases)
  # ---------------------------------------------------------------
  docker-build:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: validate
    # Only run on main pushes or explicit manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets
        id: docker-hub-check
        run: echo "enabled=${{ secrets.DOCKERHUB_TOKEN != '' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.docker-hub-check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false                     # change to true when secrets are configured
          tags: amtp/protocol:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true           # Docker is a nice-to-have, not blocking

      - name: Trivy vulnerability scan (file system)
        if: success() || failure()        # run even if Docker build had warnings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: amtp/protocol:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ---------------------------------------------------------------
  # Job 3 — Release on tags (npm publish + GitHub Release)
  # ---------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci --ignore-scripts

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: -u --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Build & test
        run: |
          npm run build
          npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build artifacts archive
        run: |
          tar czf amtp-protocol-${{ github.ref_name }}.tar.gz \
            dist/ package.json package-lock.json LICENSE README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: amtp-protocol-${{ github.ref_name }}.tar.gz
          body_path: CHANGELOG.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
